version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-development-dependencies:
        dependency-type: development
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-development-dependencies:
        dependency-type: development
  - package-ecosystem: gradle
    directory: /java
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
