name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Each PR has its own group; pushes to main are never cancelled by newer runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    runs-on: ubuntu-latest
    # Retain the aggregate suite and both forced database qualifications.
    timeout-minutes: 22

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align repository Gradle home with the CI cache
        run: echo "TRACEPERMIT_GRADLE_USER_HOME=$HOME/.gradle" >> "$GITHUB_ENV"

      - name: Use Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Verify React console and Java backend
        run: pnpm check

      - name: Verify durable PostgreSQL enforcement state
        run: pnpm test:java-postgres --rerun-tasks

      - name: Verify MariaDB standalone permit consumption
        run: pnpm test:java-mariadb --rerun-tasks

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align repository Gradle home with the CI cache
        run: echo "TRACEPERMIT_GRADLE_USER_HOME=$HOME/.gradle" >> "$GITHUB_ENV"

      - name: Use Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Verify source-free simulator approval distribution
        run: |
          pnpm build:distribution
          pnpm test:distribution

      - name: Verify simulator-only container install profile
        run: |
          pnpm build:container-profile
          pnpm test:container-profile

      - name: Verify source-free endpoint connector distribution
        run: |
          pnpm build:endpoint-distribution
          pnpm test:endpoint-distribution

      - name: Verify source-free GitHub pilot operator diagnostics
        run: |
          bash scripts/build-pilot-operator-distribution.sh --max-workers=2
          bash scripts/test-pilot-operator-distribution.sh

  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align repository Gradle home with the CI cache
        run: echo "TRACEPERMIT_GRADLE_USER_HOME=$HOME/.gradle" >> "$GITHUB_ENV"

      - name: Use Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Verify simulator-only native client launcher
        run: pnpm test:endpoint-launcher

      - name: Verify deterministic presenter qualification (Gate C)
        run: |
          pnpm test:gate-c
          pnpm demo:gate-c
          pnpm demo:verify

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify CI completion gate regressions
        run: node --test scripts/ci-workflow.test.mjs

      - name: Check formatting
        run: pnpm format:check

      - name: Install and build static documentation site
        run: |
          npm --prefix site ci
          npm --prefix site audit --audit-level=low
          pnpm site:build
          node --test scripts/site-search-compatibility.test.mjs
          node --test scripts/site-verification.test.mjs
          node --test scripts/intro-visuals.test.mjs
          node --test scripts/security-domain-guide.test.mjs

      - name: Check documentation links
        run: pnpm docs:links

      - name: Check generated flow diagrams and guide synchronization
        run: pnpm docs:flows:check

  operation-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Verify the shared operation repository contract on both engines
        run: TRACEPERMIT_GRADLE_USER_HOME="$HOME/.gradle" bash scripts/run-java-operation-tests.sh --rerun-tasks

  browser-approvals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen test dependencies
        run: pnpm install --frozen-lockfile

      - name: Align repository Gradle home with the CI cache
        run: echo "TRACEPERMIT_GRADLE_USER_HOME=$HOME/.gradle" >> "$GITHUB_ENV"

      - name: Use Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Explicitly prepare the pinned Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify the rendered simulator approval inbox
        run: pnpm test:approvals:browser

      - name: Verify browser approval review download against Java export route
        run: pnpm test:approval-export:browser

      - name: Verify built documentation onboarding and responsive navigation
        run: |
          npm --prefix site ci
          pnpm site:build
          node --test scripts/site-onboarding-browser.test.mjs
          node --test scripts/site-verification-browser.test.mjs

  # Preserve the existing required check name and reject every incomplete lane.
  verify:
    if: ${{ always() }}
    needs:
      - core
      - packaging
      - qualification
      - docs
      - operation-repository
      - browser-approvals
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const required = ["core", "packaging", "qualification", "docs", "operation-repository", "browser-approvals"];
          const results = JSON.parse(process.env.NEEDS_JSON);
          const incomplete = required.filter((job) => results[job]?.result !== "success");
          if (incomplete.length > 0) {
            console.error(`Required CI jobs did not succeed: ${incomplete.join(", ")}`);
            process.exit(1);
          }
          console.log("Every required CI job succeeded.");
          NODE
