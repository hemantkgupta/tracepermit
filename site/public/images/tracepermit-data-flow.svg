<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1370" viewBox="0 0 1000 1370" role="img" aria-labelledby="title desc">
  <title id="title">TracePermit request data flow</title>
  <desc id="desc">A human or scheduled goal reaches an AI orchestrator, which proposes a structured tool call. The call crosses into TracePermit at a trusted MCP or API adapter, where identity is verified, the action normalized, sequence context derived, intent classified, and policy evaluated. Allow or exact approval can produce a single-use permit for a simulator. Block or pending approval cannot dispatch; sanitize is re-evaluated. Evidence is published after the decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#64849b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { fill: #102f47; font-size: 38px; font-weight: 800; }
      .subtitle { fill: #506c80; font-size: 19px; }
      .label { fill: #087b87; font-size: 18px; font-weight: 750; letter-spacing: 1.3px; }
      .step { fill: #17354b; font-size: 23px; font-weight: 750; }
      .body { fill: #405e71; font-size: 18px; }
      .small { fill: #547085; font-size: 16px; }
    </style>
  </defs>

  <rect width="1000" height="1370" fill="#ffffff"/>
  <rect x="44" y="42" width="8" height="78" rx="4" fill="#087b87"/>
  <text class="title" x="68" y="78">One action, end to end</text>
  <text class="subtitle" x="68" y="111">TracePermit data flow · nothing reaches a target before enforcement</text>

  <text class="label" x="44" y="159">BEFORE TRACEPERMIT · THE AGENT PROPOSES AN ACTION</text>
  <rect x="44" y="182" width="912" height="111" rx="16" fill="#f2f6f8" stroke="#b9cbd5" stroke-width="2"/>
  <circle cx="83" cy="237" r="22" fill="#506c80"/><text x="83" y="245" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="750">1</text>
  <text class="step" x="121" y="226">Human prompt or signed scheduled goal</text>
  <text class="body" x="121" y="258">Hosted model, CLI agent or scheduler produces a structured tool proposal.</text>
  <path d="M500 294 V314" fill="none" stroke="#64849b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="44" y="321" width="912" height="121" rx="16" fill="#f2f6f8" stroke="#b9cbd5" stroke-width="2"/>
  <circle cx="83" cy="377" r="22" fill="#506c80"/><text x="83" y="385" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="750">2</text>
  <text class="step" x="121" y="364">Structured MCP / API proposal</text>
  <text class="body" x="121" y="394">Exact tool name + JSON arguments travel with OAuth, source or workload proof.</text>
  <text class="small" x="121" y="423">For a hosted client, the provider model has already seen the prompt.</text>

  <path d="M44 473 H956" fill="none" stroke="#087b87" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="293" y="456" width="414" height="34" rx="17" fill="#087b87"/>
  <text x="500" y="479" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="750">TRACEPERMIT INTERCEPTION BOUNDARY</text>
  <path d="M500 491 V512" fill="none" stroke="#64849b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text class="label" x="44" y="533">JAVA GATEWAY · VERIFY, UNDERSTAND, DECIDE</text>
  <rect x="44" y="552" width="912" height="111" rx="16" fill="#f1f8fb" stroke="#9ac7d1" stroke-width="2"/>
  <circle cx="83" cy="607" r="22" fill="#087b87"/><text x="83" y="615" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="750">3</text>
  <text class="step" x="121" y="596">Verify caller and delegation</text>
  <text class="body" x="121" y="627">Derive subject, actor, trigger and scopes from trusted evidence—not request labels.</text>
  <path d="M500 664 V684" fill="none" stroke="#64849b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="44" y="692" width="912" height="111" rx="16" fill="#f1f8fb" stroke="#9ac7d1" stroke-width="2"/>
  <circle cx="83" cy="747" r="22" fill="#087b87"/><text x="83" y="755" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="750">4</text>
  <text class="step" x="121" y="736">Normalize and understand the action</text>
  <text class="body" x="121" y="767">Typed tool + target + arguments + gateway-owned recent-action sequence.</text>
  <path d="M500 804 V824" fill="none" stroke="#64849b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="44" y="832" width="912" height="111" rx="16" fill="#eaf4f7" stroke="#86b7c2" stroke-width="2"/>
  <circle cx="83" cy="887" r="22" fill="#087b87"/><text x="83" y="895" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="750">5</text>
  <text class="step" x="121" y="876">Classify intent + evaluate versioned policy</text>
  <text class="body" x="121" y="907">Read, modify, destroy or chain; resource sensitivity and toxic sequences.</text>
  <path d="M500 944 V965 H265 V975" fill="none" stroke="#64849b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M500 965 H735 V975" fill="none" stroke="#64849b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text class="label" x="44" y="1003">POLICY OUTCOMES · THE EXECUTOR IS A SEPARATE CHECK</text>
  <rect x="44" y="1021" width="437" height="125" rx="16" fill="#eff9f3" stroke="#74b994" stroke-width="2"/>
  <text x="68" y="1059" fill="#166647" font-size="22" font-weight="750">ALLOW / APPROVED</text>
  <text class="body" x="68" y="1091">Exact, one-use request-bound permit.</text>
  <text class="body" x="68" y="1121">Executor verifies → safe simulator.</text>

  <rect x="519" y="1021" width="437" height="125" rx="16" fill="#fff4f3" stroke="#cf827e" stroke-width="2"/>
  <text x="543" y="1059" fill="#a53332" font-size="22" font-weight="750">BLOCK / PENDING</text>
  <text class="body" x="543" y="1091">No permit, no target dispatch.</text>
  <text class="body" x="543" y="1121">Return denial or await reviewer.</text>

  <rect x="44" y="1162" width="912" height="72" rx="14" fill="#fff9e9" stroke="#d5b76a" stroke-width="2"/>
  <text x="68" y="1192" fill="#8c6414" font-size="20" font-weight="750">SANITIZE</text>
  <text x="203" y="1192" class="body">Create a narrower derived action; re-enter steps 4–5.</text>
  <text x="203" y="1218" class="small">Sanitization alone never issues an execution permit.</text>

  <path d="M500 1236 V1252" fill="none" stroke="#64849b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="44" y="1264" width="912" height="80" rx="14" fill="#eef2f5" stroke="#becdd6" stroke-width="1.5"/>
  <text x="68" y="1296" fill="#17354b" font-size="20" font-weight="750">AFTER THE DECISION</text>
  <text x="68" y="1325" class="body">Tool result or denial → client; bounded evidence → read-only console.</text>
</svg>
