<title id="flow-7-hosted-oauth-title">Flow 7: hosted model proposes, OAuth attributes, tunnel carries</title>
<desc id="flow-7-hosted-oauth-desc">Send prompt to provider backend, the hosted model proposes a configured MCP tool. During app connection, obtain a TracePermit resource access token through OAuth. Return issuer-signed access token, TracePermit does not receive the IdP password. Send MCP proposal and bearer through the configured private tunnel. Verify issuer, signature, audience, time, client, tenant mapping and scopes before dispatch. Normalize authenticated subject and asserted provider actor, evaluate the tool action. Return allowed simulated read or blocked/not_executed destruction. Display the tool result in the unmodified hosted client. One Auth0 + ChatGPT + tunnel profile qualified. Reachability is not identity, endpoint proof or provider-plan attribution.</desc>
