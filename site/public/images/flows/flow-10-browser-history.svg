<title id="flow-10-browser-history-title">Flow 10: sign in, then inspect role-scoped approval history</title>
<desc id="flow-10-browser-history-desc">Start sign-in on the numeric-loopback approval origin. Redirect with browser-bound state, nonce and S256 PKCE. Complete sign-in with the configured identity provider. Browser returns the authorization code and issuer. After checking state, exchange code and verify signed access and ID tokens. Set an opaque session cookie, reusable provider tokens stay server-side. Request exact metadata filters and a bounded page using the current session. Recheck token, membership, role, scopes and tenant/owner before querying. Return safe-rendered history and cursor, reading grants no execution authority. Synthetic browser profile is qualified. This is not a new live external-IdP or public browser qualification.</desc>
