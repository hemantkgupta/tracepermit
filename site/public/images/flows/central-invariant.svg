<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="776" viewBox="0 0 1000 776" role="img" aria-labelledby="central-invariant-title central-invariant-desc">
<title id="central-invariant-title">Supported actions: authorize before simulator execution</title>
<desc id="central-invariant-desc">Propose a registered tool action, request data is untrusted. Verify identity and required origin evidence, validate and normalize. Evaluate current tool, arguments, target and available sequence context. BLOCK: no permit or dispatch. SANITIZE: derive a new action and evaluate again.. APPROVAL: persist pending, require distinct review, then explicit owner resume. ALLOW: continue.. Verify the exact permit and claim single use before any target effect. Invoke only the fixed simulator after authorization and claim. Record outcome separately, the read-only console queries bounded projections. Configured-path control only. No real target credentials, universal agent interception or host-wide anti-bypass.</desc>
