<svg xmlns="http://www.w3.org/2000/svg" width="920" height="740" viewBox="0 0 920 740" role="img" aria-labelledby="ci-title ci-desc">
  <title id="ci-title">TracePermit: The Central Invariant Flow</title>
  <desc id="ci-desc">Every AI agent tool proposal must pass through authentication, canonical normalization, and policy evaluation before single-use execution permits or denials are issued.</desc>
  <defs>
    <marker id="ci-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ci-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ci-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ci-arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .ci-title { fill: #0f172a; font-size: 15px; font-weight: 750; }
      .ci-sub { fill: #475569; font-size: 12.5px; }
      .ci-label { fill: #087b87; font-size: 12px; font-weight: 700; }
      .ci-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8px; }
      .ci-box-teal { fill: #f0fdfa; stroke: #087b87; stroke-width: 2; rx: 8px; }
      .ci-box-green { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; rx: 8px; }
      .ci-box-red { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 8px; }
      .ci-box-amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 8px; }
      .ci-flow-line { stroke: #64748b; stroke-width: 2; fill: none; }
      .ci-badge-green { fill: #16a34a; }
      .ci-badge-red { fill: #dc2626; }
      .ci-badge-amber { fill: #d97706; }
      .badge-text { fill: #ffffff; font-size: 11px; font-weight: 750; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="740" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Invariant Header Bar -->
  <rect x="24" y="20" width="872" height="42" rx="8" fill="#173c57"/>
  <text x="44" y="47" fill="#ffffff" font-size="14.5" font-weight="750" letter-spacing="0.5px">THE CENTRAL INVARIANT</text>
  <text x="876" y="46" text-anchor="end" fill="#99f6e4" font-size="12.5" font-weight="600">Zero Direct Target Access · Evaluated Before Execution</text>

  <!-- 1. Origin: AI Agent / Workload -->
  <rect x="290" y="80" width="340" height="54" class="ci-box"/>
  <text x="460" y="103" text-anchor="middle" class="ci-title">AI Agent / CLI / Workload</text>
  <text x="460" y="122" text-anchor="middle" class="ci-sub">ChatGPT, Claude, Autonomous CLI, Scheduled Job</text>

  <!-- Arrow 1: Structured Tool Proposal -->
  <line x1="460" y1="134" x2="460" y2="162" class="ci-flow-line" marker-end="url(#ci-arrow)"/>
  <rect x="365" y="140" width="190" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="460" y="153" text-anchor="middle" class="ci-label">1. Structured Tool Proposal</text>

  <!-- 2. Trusted Gateway Adapter -->
  <rect x="250" y="170" width="420" height="64" class="ci-box-teal"/>
  <text x="460" y="195" text-anchor="middle" class="ci-title" style="fill: #087b87;">Trusted Gateway Adapter (Java Data Plane)</text>
  <text x="460" y="214" text-anchor="middle" class="ci-sub">Verifies cryptographic token / transport · Derives verified caller facts</text>

  <!-- Arrow 2: Canonical Action -->
  <line x1="460" y1="234" x2="460" y2="262" class="ci-flow-line" marker-end="url(#ci-arrow)"/>
  <rect x="350" y="240" width="220" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="460" y="253" text-anchor="middle" class="ci-label">2. Canonical Action (SHA-256 Hash)</text>

  <!-- 3. Policy Engine -->
  <rect x="250" y="270" width="420" height="64" class="ci-box"/>
  <text x="460" y="295" text-anchor="middle" class="ci-title">Policy Engine &amp; Sequence Classifier</text>
  <text x="460" y="314" text-anchor="middle" class="ci-sub">Evaluates actionClass, severity, and server-owned sliding history</text>

  <!-- Branch Split Lines -->
  <path d="M 460 334 V 358 H 170 V 382" class="ci-flow-line" style="stroke: #16a34a;" marker-end="url(#ci-arrow-green)"/>
  <path d="M 460 334 V 382" class="ci-flow-line" style="stroke: #dc2626;" marker-end="url(#ci-arrow-red)"/>
  <path d="M 460 334 V 358 H 750 V 382" class="ci-flow-line" style="stroke: #d97706;" marker-end="url(#ci-arrow-amber)"/>

  <!-- Decision Badges -->
  <rect x="120" y="347" width="100" height="22" rx="11" class="ci-badge-green"/>
  <text x="170" y="362" class="badge-text">✓ ALLOW</text>

  <rect x="410" y="347" width="100" height="22" rx="11" class="ci-badge-red"/>
  <text x="460" y="362" class="badge-text">✕ BLOCK</text>

  <rect x="670" y="347" width="160" height="22" rx="11" class="ci-badge-amber"/>
  <text x="750" y="362" class="badge-text">⚠ REQUIRE_APPROVAL</text>

  <!-- COLUMN 1: ALLOW PATH -->
  <rect x="40" y="390" width="260" height="68" class="ci-box-green"/>
  <text x="170" y="414" text-anchor="middle" class="ci-title" style="fill: #15803d;">Issue Execution Permit</text>
  <text x="170" y="433" text-anchor="middle" class="ci-sub">Signed JWS bound to exact</text>
  <text x="170" y="449" text-anchor="middle" class="ci-sub">actionHash &amp; audience</text>

  <line x1="170" y1="458" x2="170" y2="484" class="ci-flow-line" style="stroke: #16a34a;" marker-end="url(#ci-arrow-green)"/>

  <rect x="40" y="490" width="260" height="68" class="ci-box-green"/>
  <text x="170" y="514" text-anchor="middle" class="ci-title" style="fill: #15803d;">Atomic Claim (1x)</text>
  <text x="170" y="533" text-anchor="middle" class="ci-sub">PostgreSQL transaction claims</text>
  <text x="170" y="549" text-anchor="middle" class="ci-sub">permit · Replays rejected</text>

  <line x1="170" y1="558" x2="170" y2="584" class="ci-flow-line" style="stroke: #16a34a;" marker-end="url(#ci-arrow-green)"/>

  <rect x="40" y="590" width="260" height="60" class="ci-box-green" style="fill: #dcfce7; stroke-width: 2;"/>
  <text x="170" y="615" text-anchor="middle" class="ci-title" style="fill: #14532d;">Target Simulator</text>
  <text x="170" y="635" text-anchor="middle" class="ci-sub" style="fill: #166534;">Safe simulated execution (1x)</text>

  <!-- COLUMN 2: BLOCK PATH -->
  <rect x="330" y="390" width="260" height="68" class="ci-box-red"/>
  <text x="460" y="414" text-anchor="middle" class="ci-title" style="fill: #b91c1c;">Halt &amp; Reject Proposal</text>
  <text x="460" y="433" text-anchor="middle" class="ci-sub">Zero permits minted · Target API</text>
  <text x="460" y="449" text-anchor="middle" class="ci-sub">is never called</text>

  <line x1="460" y1="458" x2="460" y2="484" class="ci-flow-line" style="stroke: #dc2626;" marker-end="url(#ci-arrow-red)"/>

  <rect x="330" y="490" width="260" height="68" class="ci-box-red"/>
  <text x="460" y="514" text-anchor="middle" class="ci-title" style="fill: #b91c1c;">Append Audit Evidence</text>
  <text x="460" y="533" text-anchor="middle" class="ci-sub">Ledger records attempt,</text>
  <text x="460" y="549" text-anchor="middle" class="ci-sub">provenance &amp; reason code</text>

  <line x1="460" y1="558" x2="460" y2="584" class="ci-flow-line" style="stroke: #dc2626;" marker-end="url(#ci-arrow-red)"/>

  <rect x="330" y="590" width="260" height="60" class="ci-box-red" style="fill: #fee2e2; stroke-width: 2;"/>
  <text x="460" y="615" text-anchor="middle" class="ci-title" style="fill: #991b1b;">Zero Dispatches</text>
  <text x="460" y="635" text-anchor="middle" class="ci-sub" style="fill: #b91c1c;">Target remains completely untouched</text>

  <!-- COLUMN 3: REQUIRE_APPROVAL PATH -->
  <rect x="620" y="390" width="260" height="68" class="ci-box-amber"/>
  <text x="750" y="414" text-anchor="middle" class="ci-title" style="fill: #b45309;">Dual-Control Review</text>
  <text x="750" y="433" text-anchor="middle" class="ci-sub">State frozen on exact actionHash</text>
  <text x="750" y="449" text-anchor="middle" class="ci-sub">Self-approval forbidden</text>

  <line x1="750" y1="458" x2="750" y2="484" class="ci-flow-line" style="stroke: #d97706;" marker-end="url(#ci-arrow-amber)"/>

  <rect x="620" y="490" width="260" height="68" class="ci-box-amber"/>
  <text x="750" y="514" text-anchor="middle" class="ci-title" style="fill: #b45309;">Independent Human Signoff</text>
  <text x="750" y="533" text-anchor="middle" class="ci-sub">Privileged reviewer verifies request</text>
  <text x="750" y="549" text-anchor="middle" class="ci-sub">and grants single-use approval</text>

  <!-- Arrow from Approval to Column 1 (Issue Permit) -->
  <path d="M 620 524 H 312" class="ci-flow-line" style="stroke: #16a34a; stroke-dasharray: 5 4;" marker-end="url(#ci-arrow-green)"/>
  <rect x="350" y="512" width="220" height="20" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="460" y="526" text-anchor="middle" style="fill: #15803d; font-size: 11.5px; font-weight: 700;">Approved → Mint Permit for 1x Claim</text>

  <rect x="620" y="590" width="260" height="60" class="ci-box-amber" style="fill: #fef3c7; stroke-width: 2;"/>
  <text x="750" y="615" text-anchor="middle" class="ci-title" style="fill: #78350f;">Human Accountability</text>
  <text x="750" y="635" text-anchor="middle" class="ci-sub" style="fill: #92400e;">Dual-party identity bound in ledger</text>

  <!-- Bottom Common Bar: Audit & Evidence -->
  <rect x="40" y="675" width="840" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="460" y="702" text-anchor="middle" class="ci-title" style="fill: #334155;">
    Immutable Evidence Ledger &amp; Read-Only React Console: All outcomes recorded with cryptographic provenance
  </text>
</svg>
