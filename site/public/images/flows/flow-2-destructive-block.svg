<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="f2-title f2-desc">
  <title id="f2-title">Flow 2: Destructive Side Effect (Policy Block)</title>
  <desc id="f2-desc">Sequence diagram illustrating an unauthorized destructive action blocked by policy before reaching the simulator.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .p-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8px; }
      .p-head { fill: #0f172a; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .p-sub { fill: #64748b; font-size: 11px; text-anchor: middle; }
      .line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .msg-line { stroke: #475569; stroke-width: 1.5; fill: none; }
      .msg-dash { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .msg-text { fill: #1e293b; font-size: 12.5px; font-weight: 550; }
      .step-bg { fill: #087b87; }
      .step-num { fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .badge-block { fill: #fee2e2; stroke: #dc2626; stroke-width: 1; rx: 4px; }
      .badge-text { fill: #b91c1c; font-size: 11.5px; font-weight: 700; }
      .blocked-box { fill: #fef2f2; stroke: #f87171; stroke-width: 1.5; stroke-dasharray: 4 3; rx: 6px; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="880" height="390" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Lifelines -->
  <line x1="110" y1="65" x2="110" y2="360" class="line"/>
  <line x1="330" y1="65" x2="330" y2="360" class="line"/>
  <line x1="550" y1="65" x2="550" y2="360" class="line"/>
  <line x1="770" y1="65" x2="770" y2="360" class="line"/>

  <!-- Participants -->
  <rect x="35" y="16" width="150" height="48" class="p-box"/>
  <text x="110" y="37" class="p-head">Agent / Client</text>
  <text x="110" y="52" class="p-sub">ChatGPT / Claude / CLI</text>

  <rect x="255" y="16" width="150" height="48" class="p-box" style="stroke: #087b87; stroke-width: 2;"/>
  <text x="330" y="37" class="p-head" style="fill: #087b87;">Trusted Gateway</text>
  <text x="330" y="52" class="p-sub">Java MCP / API Adapter</text>

  <rect x="475" y="16" width="150" height="48" class="p-box"/>
  <text x="550" y="37" class="p-head">Policy Engine</text>
  <text x="550" y="52" class="p-sub">Risk Classifier &amp; Rules</text>

  <rect x="695" y="16" width="150" height="48" class="p-box"/>
  <text x="770" y="37" class="p-head">Target Simulator</text>
  <text x="770" y="52" class="p-sub">AWS EC2 Simulator</text>

  <!-- Step 1: tools/call -->
  <circle cx="120" cy="100" r="9" class="step-bg"/><text x="120" y="104" class="step-num">1</text>
  <text x="136" y="104" class="msg-text">tools/call aws.ec2.terminate_instances (Destructive prompt)</text>
  <line x1="110" y1="110" x2="324" y2="110" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 2: Normalize -->
  <circle cx="340" cy="142" r="9" class="step-bg"/><text x="340" y="146" class="step-num">2</text>
  <text x="356" y="146" class="msg-text">Authenticate caller &amp; compute Canonical Action</text>
  <path d="M 330 148 H 360 V 162 H 336" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 3: Evaluate -->
  <circle cx="340" cy="192" r="9" class="step-bg"/><text x="340" y="196" class="step-num">3</text>
  <text x="356" y="196" class="msg-text">evaluate(actionClass="delete", severity="critical")</text>
  <line x1="330" y1="202" x2="544" y2="202" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 4: Decision: BLOCK -->
  <rect x="360" y="224" width="160" height="22" class="badge-block"/>
  <text x="440" y="239" text-anchor="middle" class="badge-text">✕ BLOCK (DENY_DESTRUCTIVE)</text>
  <line x1="550" y1="248" x2="336" y2="248" class="msg-dash" marker-end="url(#arrow-red)"/>

  <!-- Step 5: Append audit evidence (not_executed) -->
  <circle cx="340" cy="278" r="9" class="step-bg"/><text x="340" y="282" class="step-num">4</text>
  <text x="356" y="282" class="msg-text">Record audit ledger: outcome="block", status="not_executed"</text>
  <path d="M 330 284 H 360 V 298 H 336" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Zero Dispatches Indicator on Simulator -->
  <rect x="680" y="260" width="180" height="42" class="blocked-box"/>
  <text x="770" y="278" text-anchor="middle" style="fill: #dc2626; font-size: 11px; font-weight: 700;">ZERO DISPATCHES</text>
  <text x="770" y="293" text-anchor="middle" style="fill: #64748b; font-size: 10px;">Simulator Never Called · No Permit</text>

  <!-- Step 6: Return Error -->
  <circle cx="120" cy="330" r="9" class="step-bg"/><text x="120" y="334" class="step-num">5</text>
  <text x="136" y="334" class="msg-text" style="fill: #dc2626;">Error: Action blocked by policy (no permit issued)</text>
  <line x1="330" y1="340" x2="116" y2="340" class="msg-dash" marker-end="url(#arrow-red)"/>
</svg>
