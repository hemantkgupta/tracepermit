<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="f2-title f2-desc">
  <title id="f2-title">Flow 2: Destructive Side Effect (Policy Block)</title>
  <desc id="f2-desc">Sequence diagram illustrating an unauthorized destructive action blocked by policy before reaching the simulator.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .p-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8px; }
      .p-head { fill: #0f172a; font-size: 14.5px; font-weight: 750; text-anchor: middle; }
      .p-sub { fill: #64748b; font-size: 11.5px; text-anchor: middle; }
      .line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .msg-line { stroke: #475569; stroke-width: 1.8; fill: none; }
      .msg-dash-red { stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
      .msg-text { fill: #0f172a; font-size: 13px; font-weight: 600; }
      .step-bg { fill: #087b87; }
      .step-num { fill: #ffffff; font-size: 11px; font-weight: 750; text-anchor: middle; }
      .badge-block { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.2; rx: 5px; }
      .badge-text { fill: #b91c1c; font-size: 12px; font-weight: 750; text-anchor: middle; }
      .proc-box { fill: #f0fdfa; stroke: #087b87; stroke-width: 1.2; rx: 6px; }
      .proc-text { fill: #0f766e; font-size: 12px; font-weight: 600; }
      .blocked-box { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 5 4; rx: 8px; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="420" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Lifelines -->
  <line x1="110" y1="68" x2="110" y2="395" class="line"/>
  <line x1="340" y1="68" x2="340" y2="395" class="line"/>
  <line x1="570" y1="68" x2="570" y2="395" class="line"/>
  <line x1="800" y1="68" x2="800" y2="395" class="line"/>

  <!-- Participants -->
  <rect x="35" y="18" width="150" height="50" class="p-box"/>
  <text x="110" y="39" class="p-head">Agent / Client</text>
  <text x="110" y="55" class="p-sub">ChatGPT / Claude / CLI</text>

  <rect x="255" y="18" width="170" height="50" class="p-box" style="stroke: #087b87; stroke-width: 2; fill: #f0fdfa;"/>
  <text x="340" y="39" class="p-head" style="fill: #087b87;">Trusted Gateway</text>
  <text x="340" y="55" class="p-sub">Java MCP / API Adapter</text>

  <rect x="485" y="18" width="170" height="50" class="p-box"/>
  <text x="570" y="39" class="p-head">Policy Engine</text>
  <text x="570" y="55" class="p-sub">Risk Classifier &amp; Rules</text>

  <rect x="715" y="18" width="170" height="50" class="p-box"/>
  <text x="800" y="39" class="p-head">Target Simulator</text>
  <text x="800" y="55" class="p-sub">AWS EC2 Simulator</text>

  <!-- Step 1: tools/call -->
  <circle cx="125" cy="100" r="9" class="step-bg"/><text x="125" y="104" class="step-num">1</text>
  <text x="142" y="104" class="msg-text">tools/call aws.ec2.terminate_instances (Destructive prompt)</text>
  <line x1="110" y1="112" x2="332" y2="112" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 2: Normalize & Compute Action -->
  <rect x="205" y="136" width="270" height="30" class="proc-box"/>
  <circle cx="222" cy="151" r="8" class="step-bg"/><text x="222" y="155" class="step-num">2</text>
  <text x="238" y="155" class="proc-text">Authenticate caller &amp; compute Canonical Action</text>

  <!-- Step 3: Evaluate -->
  <circle cx="355" cy="192" r="9" class="step-bg"/><text x="355" y="196" class="step-num">3</text>
  <text x="372" y="196" class="msg-text">evaluate(actionClass="delete", severity="critical")</text>
  <line x1="340" y1="204" x2="562" y2="204" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 4: Decision BLOCK -->
  <rect x="365" y="226" width="180" height="24" class="badge-block"/>
  <text x="455" y="242" class="badge-text">✕ BLOCK (DENY_DESTRUCTIVE)</text>
  <line x1="570" y1="258" x2="348" y2="258" class="msg-dash-red" marker-end="url(#arrow-red)"/>

  <!-- Step 5: Append audit evidence -->
  <rect x="205" y="284" width="270" height="30" class="proc-box" style="stroke: #dc2626; fill: #fef2f2;"/>
  <circle cx="222" cy="299" r="8" style="fill: #dc2626;"/><text x="222" y="303" class="step-num">4</text>
  <text x="238" y="303" class="proc-text" style="fill: #991b1b;">Record audit: outcome="block", not_executed</text>

  <!-- Simulator: Zero Dispatches Box (No overlap, perfectly positioned) -->
  <rect x="710" y="234" width="180" height="74" class="blocked-box"/>
  <text x="800" y="258" text-anchor="middle" style="fill: #dc2626; font-size: 12px; font-weight: 750;">ZERO DISPATCHES</text>
  <text x="800" y="278" text-anchor="middle" style="fill: #475569; font-size: 11.5px;">Simulator is NEVER called</text>
  <text x="800" y="295" text-anchor="middle" style="fill: #64748b; font-size: 10.5px;">Zero execution permits minted</text>

  <!-- Step 6: Return Error -->
  <circle cx="125" cy="354" r="9" class="step-bg" style="fill: #dc2626;"/><text x="125" y="358" class="step-num">5</text>
  <text x="142" y="358" class="msg-text" style="fill: #dc2626;">Error: Action blocked by policy (no permit issued)</text>
  <line x1="340" y1="366" x2="118" y2="366" class="msg-dash-red" marker-end="url(#arrow-red)"/>
</svg>
