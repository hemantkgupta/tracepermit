<svg xmlns="http://www.w3.org/2000/svg" width="890" height="520" viewBox="0 0 890 520" role="img" aria-labelledby="f3-title f3-desc">
  <title id="f3-title">Flow 3: Dual-Control Human Approval (Two-Man Rule)</title>
  <desc id="f3-desc">Sequence diagram illustrating a request-bound human approval flow with independent reviewer signoff and atomic permit claim.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .p-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8px; }
      .p-head { fill: #0f172a; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .p-sub { fill: #64748b; font-size: 11px; text-anchor: middle; }
      .line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .msg-line { stroke: #475569; stroke-width: 1.5; fill: none; }
      .msg-dash { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .msg-text { fill: #1e293b; font-size: 12px; font-weight: 550; }
      .step-bg { fill: #087b87; }
      .step-num { fill: #ffffff; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
      .badge-amber { fill: #fef3c7; stroke: #d97706; stroke-width: 1; rx: 4px; }
      .badge-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; rx: 4px; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="890" height="520" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Lifelines -->
  <line x1="90" y1="65" x2="90" y2="490" class="line"/>
  <line x1="270" y1="65" x2="270" y2="490" class="line"/>
  <line x1="450" y1="65" x2="450" y2="490" class="line"/>
  <line x1="630" y1="65" x2="630" y2="490" class="line"/>
  <line x1="800" y1="65" x2="800" y2="490" class="line"/>

  <!-- Participants -->
  <rect x="20" y="16" width="140" height="48" class="p-box"/>
  <text x="90" y="37" class="p-head">Agent (Workload)</text>
  <text x="90" y="52" class="p-sub">Signed Proposer</text>

  <rect x="200" y="16" width="140" height="48" class="p-box" style="stroke: #087b87; stroke-width: 2;"/>
  <text x="270" y="37" class="p-head" style="fill: #087b87;">Gateway / Approvals</text>
  <text x="270" y="52" class="p-sub">Java Policy Authority</text>

  <rect x="380" y="16" width="140" height="48" class="p-box"/>
  <text x="450" y="37" class="p-head">PostgreSQL DB</text>
  <text x="450" y="52" class="p-sub">Durable Claims Ledger</text>

  <rect x="560" y="16" width="140" height="48" class="p-box"/>
  <text x="630" y="37" class="p-head">Human Reviewer</text>
  <text x="630" y="52" class="p-sub">Independent Approver</text>

  <rect x="730" y="16" width="140" height="48" class="p-box"/>
  <text x="800" y="37" class="p-head">Target Simulator</text>
  <text x="800" y="52" class="p-sub">AWS Security Group</text>

  <!-- Step 1: Proposal -->
  <circle cx="100" cy="98" r="8.5" class="step-bg"/><text x="100" y="102" class="step-num">1</text>
  <text x="114" y="102" class="msg-text">tools/call update_security_group (sg-demo)</text>
  <line x1="90" y1="108" x2="264" y2="108" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 2: Policy Require Approval -->
  <rect x="280" y="122" width="160" height="20" class="badge-amber"/>
  <text x="360" y="136" text-anchor="middle" style="fill: #92400e; font-size: 11px; font-weight: 700;">⚠ REQUIRE_APPROVAL</text>

  <!-- Step 3: Store Pending in DB -->
  <circle cx="280" cy="158" r="8.5" class="step-bg"/><text x="280" y="162" class="step-num">2</text>
  <text x="294" y="162" class="msg-text">Store pending approval bound to exact actionHash</text>
  <line x1="270" y1="168" x2="444" y2="168" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 4: Return Pending -->
  <text x="180" y="196" text-anchor="middle" class="msg-text" style="fill: #b45309;">PENDING_APPROVAL (requestId: appr-101)</text>
  <line x1="270" y1="202" x2="96" y2="202" class="msg-dash" marker-end="url(#arrow-amber)"/>

  <!-- Step 5: Self-Approval Attempt -->
  <circle cx="100" cy="232" r="8.5" class="step-bg"/><text x="100" y="236" class="step-num">3</text>
  <text x="114" y="236" class="msg-text">Proposer attempts self-approval → <tspan style="fill: #dc2626; font-weight: 700;">REJECTED</tspan></text>
  <line x1="90" y1="242" x2="264" y2="242" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 6: Independent Reviewer Approves -->
  <circle cx="460" cy="282" r="8.5" class="step-bg"/><text x="460" y="286" class="step-num">4</text>
  <text x="474" y="286" class="msg-text">Independent Human Approver decides: "approved"</text>
  <line x1="630" y1="292" x2="276" y2="292" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 7: Atomic Claim in DB -->
  <circle cx="280" cy="332" r="8.5" class="step-bg"/><text x="280" y="336" class="step-num">5</text>
  <text x="294" y="336" class="msg-text">TX: Mark APPROVED + Atomically Claim Permit ID (1x)</text>
  <line x1="270" y1="342" x2="444" y2="342" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 8: Approved badge -->
  <rect x="300" y="358" width="140" height="20" class="badge-green"/>
  <text x="370" y="372" text-anchor="middle" style="fill: #15803d; font-size: 11px; font-weight: 700;">✓ CLAIM COMMITTED</text>

  <!-- Step 9: Execute Against Simulator -->
  <circle cx="280" cy="402" r="8.5" class="step-bg"/><text x="280" y="406" class="step-num">6</text>
  <text x="294" y="406" class="msg-text">execute(canonical action, approved permit)</text>
  <line x1="270" y1="412" x2="794" y2="412" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 10: Simulated Result -->
  <text x="535" y="446" text-anchor="middle" class="msg-text" style="fill: #15803d;">Simulated Security Group update successful</text>
  <line x1="800" y1="452" x2="276" y2="452" class="msg-dash" marker-end="url(#arrow-green)"/>

  <!-- Step 11: Record Outcome -->
  <circle cx="280" cy="478" r="8.5" class="step-bg"/><text x="280" y="482" class="step-num">7</text>
  <text x="294" y="482" class="msg-text">Append outcome evidence &amp; publish outbox</text>
  <line x1="270" y1="488" x2="444" y2="488" class="msg-line" marker-end="url(#arrow)"/>
</svg>
