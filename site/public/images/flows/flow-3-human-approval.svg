<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="f3-title f3-desc">
  <title id="f3-title">Flow 3: Dual-Control Human Approval (Two-Man Rule)</title>
  <desc id="f3-desc">Sequence diagram illustrating a request-bound human approval flow with independent reviewer signoff and atomic permit claim.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .p-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8px; }
      .p-head { fill: #0f172a; font-size: 13.5px; font-weight: 750; text-anchor: middle; }
      .p-sub { fill: #64748b; font-size: 11px; text-anchor: middle; }
      .line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .msg-line { stroke: #475569; stroke-width: 1.8; fill: none; }
      .msg-dash { stroke: #475569; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
      .msg-dash-amber { stroke: #d97706; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
      .msg-dash-green { stroke: #16a34a; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
      .msg-text { fill: #0f172a; font-size: 12.5px; font-weight: 600; }
      .step-bg { fill: #087b87; }
      .step-num { fill: #ffffff; font-size: 10.5px; font-weight: 750; text-anchor: middle; }
      .badge-amber { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; rx: 5px; }
      .badge-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.2; rx: 5px; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="540" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Lifelines -->
  <line x1="90" y1="68" x2="90" y2="515" class="line"/>
  <line x1="270" y1="68" x2="270" y2="515" class="line"/>
  <line x1="450" y1="68" x2="450" y2="515" class="line"/>
  <line x1="630" y1="68" x2="630" y2="515" class="line"/>
  <line x1="810" y1="68" x2="810" y2="515" class="line"/>

  <!-- Participants -->
  <rect x="20" y="18" width="140" height="50" class="p-box"/>
  <text x="90" y="39" class="p-head">Agent (Workload)</text>
  <text x="90" y="55" class="p-sub">Signed Proposer</text>

  <rect x="200" y="18" width="140" height="50" class="p-box" style="stroke: #087b87; stroke-width: 2; fill: #f0fdfa;"/>
  <text x="270" y="39" class="p-head" style="fill: #087b87;">Gateway / Policy</text>
  <text x="270" y="55" class="p-sub">Approval Authority</text>

  <rect x="380" y="18" width="140" height="50" class="p-box"/>
  <text x="450" y="39" class="p-head">PostgreSQL DB</text>
  <text x="450" y="55" class="p-sub">Durable Claims Ledger</text>

  <rect x="560" y="18" width="140" height="50" class="p-box"/>
  <text x="630" y="39" class="p-head">Human Reviewer</text>
  <text x="630" y="55" class="p-sub">Independent Approver</text>

  <rect x="740" y="18" width="140" height="50" class="p-box"/>
  <text x="810" y="39" class="p-head">Target Simulator</text>
  <text x="810" y="55" class="p-sub">AWS Security Group</text>

  <!-- Step 1: Proposal -->
  <circle cx="105" cy="100" r="8.5" class="step-bg"/><text x="105" y="104" class="step-num">1</text>
  <text x="120" y="104" class="msg-text">tools/call update_security_group (sg-demo)</text>
  <line x1="90" y1="112" x2="262" y2="112" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 2: Policy Require Approval -->
  <rect x="280" y="128" width="170" height="22" class="badge-amber"/>
  <text x="365" y="143" text-anchor="middle" style="fill: #92400e; font-size: 11.5px; font-weight: 750;">⚠ REQUIRE_APPROVAL</text>

  <!-- Step 3: Store Pending in DB -->
  <circle cx="285" cy="166" r="8.5" class="step-bg"/><text x="285" y="170" class="step-num">2</text>
  <text x="300" y="170" class="msg-text">Store pending approval bound to exact actionHash</text>
  <line x1="270" y1="178" x2="442" y2="178" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 4: Return Pending to Proposer -->
  <text x="180" y="206" text-anchor="middle" class="msg-text" style="fill: #b45309;">PENDING_APPROVAL (requestId: appr-101)</text>
  <line x1="270" y1="214" x2="98" y2="214" class="msg-dash-amber" marker-end="url(#arrow-amber)"/>

  <!-- Step 5: Self-Approval Attempt REJECTED -->
  <circle cx="105" cy="242" r="8.5" class="step-bg"/><text x="105" y="246" class="step-num">3</text>
  <text x="120" y="246" class="msg-text">Proposer attempts self-approval → <tspan style="fill: #dc2626; font-weight: 750;">REJECTED</tspan></text>
  <line x1="90" y1="254" x2="262" y2="254" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 6: Independent Reviewer Approves -->
  <circle cx="455" cy="286" r="8.5" class="step-bg"/><text x="455" y="290" class="step-num">4</text>
  <text x="470" y="290" class="msg-text">Independent Human Approver decides: "approved"</text>
  <line x1="630" y1="298" x2="278" y2="298" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 7: Atomic Claim in DB -->
  <circle cx="285" cy="330" r="8.5" class="step-bg"/><text x="285" y="334" class="step-num">5</text>
  <text x="300" y="334" class="msg-text">TX: Verify reviewer != proposer &amp; Claim Permit ID (1x)</text>
  <line x1="270" y1="342" x2="442" y2="342" class="msg-line" marker-end="url(#arrow)"/>

  <rect x="380" y="356" width="140" height="20" class="badge-green"/>
  <text x="450" y="370" text-anchor="middle" style="fill: #15803d; font-size: 11px; font-weight: 750;">✓ CLAIM COMMITTED</text>

  <!-- Step 8: Execute Against Simulator -->
  <circle cx="285" cy="398" r="8.5" class="step-bg"/><text x="285" y="402" class="step-num">6</text>
  <text x="300" y="402" class="msg-text">execute(canonical action, approved permit)</text>
  <line x1="270" y1="410" x2="802" y2="410" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 9: Simulated Result -->
  <text x="540" y="444" text-anchor="middle" class="msg-text" style="fill: #15803d;">Simulated Security Group update successful</text>
  <line x1="810" y1="452" x2="278" y2="452" class="msg-dash-green" marker-end="url(#arrow-green)"/>

  <!-- Step 10: Record Outcome Evidence -->
  <circle cx="285" cy="480" r="8.5" class="step-bg"/><text x="285" y="484" class="step-num">7</text>
  <text x="300" y="484" class="msg-text">Append outcome evidence &amp; publish outbox</text>
  <line x1="270" y1="492" x2="442" y2="492" class="msg-line" marker-end="url(#arrow)"/>
</svg>
