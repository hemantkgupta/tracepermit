<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="796" viewBox="0 0 1000 796" role="img" aria-labelledby="flow-6-endpoint-attribution-title flow-6-endpoint-attribution-desc">
<title id="flow-6-endpoint-attribution-title">Flow 6: endpoint evidence bound to request and credential</title>
<desc id="flow-6-endpoint-attribution-desc">Send strict MCP JSON-RPC over stdio, no trusted identity fields in arguments. Observe immediate parent, executable hash/start time, device and terminal facts. Sign short-lived Ed25519 proof bound to canonical MCP request and bearer fingerprint. Check observed process stability immediately before forwarding. POST exact loopback /mcp with bearer and separate source-attestation header. Authenticate, verify enrolled key, audience, time, request/credential bindings and single use. Build canonical action with bounded verified source facts, then evaluate policy. Invalid or replayed proof stops before protected tool dispatch. A valid proof still does not authorize an action.. Development origin evidence only. This is not the separate bearer-only Codex approval profile or managed-device assurance.</desc>
