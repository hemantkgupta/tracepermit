<svg xmlns="http://www.w3.org/2000/svg" width="890" height="520" viewBox="0 0 890 520" role="img" aria-labelledby="f5-title f5-desc">
  <title id="f5-title">Flow 5: Semantic Sequence &amp; Multi-Step Defense (Anti-Exfiltration)</title>
  <desc id="f5-desc">Sequence diagram illustrating stateful multi-step exfiltration detection where gateway history blocks external transmission following a customer read.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .p-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8px; }
      .p-head { fill: #0f172a; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .p-sub { fill: #64748b; font-size: 11px; text-anchor: middle; }
      .line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .msg-line { stroke: #475569; stroke-width: 1.5; fill: none; }
      .msg-dash { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .msg-text { fill: #1e293b; font-size: 12px; font-weight: 550; }
      .step-bg { fill: #087b87; }
      .step-num { fill: #ffffff; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
      .phase-label { fill: #0369a1; font-size: 11.5px; font-weight: 750; letter-spacing: 0.5px; }
      .badge-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; rx: 4px; }
      .badge-red { fill: #fee2e2; stroke: #dc2626; stroke-width: 1; rx: 4px; }
      .blocked-box { fill: #fef2f2; stroke: #f87171; stroke-width: 1.5; stroke-dasharray: 4 3; rx: 6px; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="890" height="520" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Lifelines -->
  <line x1="90" y1="65" x2="90" y2="490" class="line"/>
  <line x1="270" y1="65" x2="270" y2="490" class="line"/>
  <line x1="450" y1="65" x2="450" y2="490" class="line"/>
  <line x1="630" y1="65" x2="630" y2="490" class="line"/>
  <line x1="800" y1="65" x2="800" y2="490" class="line"/>

  <!-- Participants -->
  <rect x="20" y="16" width="140" height="48" class="p-box"/>
  <text x="90" y="37" class="p-head">Workload Sub-Agent</text>
  <text x="90" y="52" class="p-sub">Scheduled / Multi-Step</text>

  <rect x="200" y="16" width="140" height="48" class="p-box" style="stroke: #087b87; stroke-width: 2;"/>
  <text x="270" y="37" class="p-head" style="fill: #087b87;">Gateway &amp; History</text>
  <text x="270" y="52" class="p-sub">Sliding-Window Store</text>

  <rect x="380" y="16" width="140" height="48" class="p-box"/>
  <text x="450" y="37" class="p-head">Policy Engine</text>
  <text x="450" y="52" class="p-sub">Sequence Classifier</text>

  <rect x="560" y="16" width="140" height="48" class="p-box"/>
  <text x="630" y="37" class="p-head">CRM Simulator</text>
  <text x="630" y="52" class="p-sub">Customer PII Store</text>

  <rect x="730" y="16" width="140" height="48" class="p-box"/>
  <text x="800" y="37" class="p-head">Egress Outbox</text>
  <text x="800" y="52" class="p-sub">External Webhook</text>

  <!-- PHASE 1: BULK CUSTOMER READ -->
  <rect x="30" y="80" width="830" height="24" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="45" y="96" class="phase-label">STEP 1: BULK CUSTOMER READ (BENIGN READ ALLOWED)</text>

  <!-- Step 1: Read Request -->
  <circle cx="100" cy="122" r="8.5" class="step-bg"/><text x="100" y="126" class="step-num">1</text>
  <text x="114" y="126" class="msg-text">tools/call crm.get_customer_records</text>
  <line x1="90" y1="132" x2="264" y2="132" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 2: Read Allow -->
  <circle cx="280" cy="154" r="8.5" class="step-bg"/><text x="280" y="158" class="step-num">2</text>
  <text x="294" y="158" class="msg-text">evaluate(read) → ALLOW · Record in sliding-window history</text>
  <line x1="270" y1="164" x2="444" y2="164" class="msg-line" marker-end="url(#arrow-green)"/>

  <!-- Step 3: Execute read -->
  <line x1="270" y1="194" x2="624" y2="194" class="msg-line" marker-end="url(#arrow)"/>
  <text x="450" y="188" text-anchor="middle" class="msg-text">execute read with bounded permit</text>

  <!-- Step 4: Return 20 records -->
  <line x1="630" y1="222" x2="96" y2="222" class="msg-dash" marker-end="url(#arrow)"/>
  <text x="360" y="216" text-anchor="middle" class="msg-text" style="fill: #0369a1;">20 synthetic customer records returned</text>

  <!-- PHASE 2: IMMEDIATE EXTERNAL EGRESS -->
  <rect x="30" y="252" width="830" height="24" rx="4" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
  <text x="45" y="268" class="phase-label" style="fill: #be123c;">STEP 2: IMMEDIATE EXTERNAL EGRESS ATTEMPT (TOXIC SEQUENCE BLOCKED)</text>

  <!-- Step 5: External Send Proposal -->
  <circle cx="100" cy="298" r="8.5" class="step-bg"/><text x="100" y="302" class="step-num">3</text>
  <text x="114" y="302" class="msg-text">tools/call messaging.send_external_webhook(data=records)</text>
  <line x1="90" y1="308" x2="264" y2="308" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 6: Evaluate against History -->
  <circle cx="280" cy="340" r="8.5" class="step-bg"/><text x="280" y="344" class="step-num">4</text>
  <text x="294" y="344" class="msg-text">evaluate(send, historyContext) · Detects: PII Read → External Send</text>
  <line x1="270" y1="350" x2="444" y2="350" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 7: Sequence Block Badge -->
  <rect x="300" y="374" width="230" height="22" class="badge-red"/>
  <text x="415" y="389" text-anchor="middle" style="fill: #b91c1c; font-size: 11px; font-weight: 700;">✕ BLOCK (PII_EXFILTRATION_SEQUENCE)</text>
  <line x1="450" y1="400" x2="276" y2="400" class="msg-dash" marker-end="url(#arrow-red)"/>

  <!-- Egress Outbox Never Called -->
  <rect x="710" y="380" width="170" height="42" class="blocked-box"/>
  <text x="795" y="398" text-anchor="middle" style="fill: #dc2626; font-size: 11px; font-weight: 700;">ZERO EGRESS</text>
  <text x="795" y="413" text-anchor="middle" style="fill: #64748b; font-size: 10px;">Outbox Never Called · Blocked</text>

  <!-- Step 8: Error to Caller -->
  <circle cx="100" cy="450" r="8.5" class="step-bg"/><text x="100" y="454" class="step-num">5</text>
  <text x="114" y="454" class="msg-text" style="fill: #dc2626;">Error: Blocked by sequence policy (SYNTHETIC_PII_EXFILTRATION)</text>
  <line x1="270" y1="460" x2="96" y2="460" class="msg-dash" marker-end="url(#arrow-red)"/>
</svg>
