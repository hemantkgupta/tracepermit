<title id="flow-5-sequence-exfiltration-title">Flow 5: synthetic read followed by external-send denial</title>
<desc id="flow-5-sequence-exfiltration-desc">Baseline demo.egress.send_external without read history. BLOCK: EXTERNAL_SEND_NOT_AUTHORIZED, no target dispatch. Independently signed demo.customer.bulk_read. After allow, record authorized read proposal for tenant plus verified subject. Execute permit-bound fixed read, receive 20 invented records. Independently signed demo.egress.send_external after the read. Load cross-target history, derive SYNTHETIC_PII_READ_THEN_EXTERNAL_SEND. BLOCK: SYNTHETIC_PII_EXFILTRATION_SEQUENCE_BLOCKED, critical severity. Neither send reaches the outbox. Sequence history adds a specific reason, not permission to send without history.</desc>
