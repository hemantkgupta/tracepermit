<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="f5-title f5-desc">
  <title id="f5-title">Flow 5: Semantic Sequence &amp; Multi-Step Defense (Anti-Exfiltration)</title>
  <desc id="f5-desc">Sequence diagram illustrating stateful multi-step exfiltration detection where gateway history blocks external transmission following a customer read.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .p-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8px; }
      .p-head { fill: #0f172a; font-size: 13.5px; font-weight: 750; text-anchor: middle; }
      .p-sub { fill: #64748b; font-size: 11px; text-anchor: middle; }
      .line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .msg-line { stroke: #475569; stroke-width: 1.8; fill: none; }
      .msg-dash { stroke: #475569; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
      .msg-dash-red { stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
      .msg-text { fill: #0f172a; font-size: 12.5px; font-weight: 600; }
      .step-bg { fill: #087b87; }
      .step-num { fill: #ffffff; font-size: 10.5px; font-weight: 750; text-anchor: middle; }
      .phase-label { fill: #0369a1; font-size: 11.5px; font-weight: 750; letter-spacing: 0.5px; }
      .badge-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.2; rx: 5px; }
      .badge-red { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.2; rx: 5px; }
      .blocked-box { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 5 4; rx: 8px; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="540" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Lifelines -->
  <line x1="90" y1="68" x2="90" y2="515" class="line"/>
  <line x1="270" y1="68" x2="270" y2="515" class="line"/>
  <line x1="450" y1="68" x2="450" y2="515" class="line"/>
  <line x1="630" y1="68" x2="630" y2="515" class="line"/>
  <line x1="810" y1="68" x2="810" y2="515" class="line"/>

  <!-- Participants -->
  <rect x="20" y="18" width="140" height="50" class="p-box"/>
  <text x="90" y="39" class="p-head">Workload Sub-Agent</text>
  <text x="90" y="55" class="p-sub">Scheduled / Multi-Step</text>

  <rect x="200" y="18" width="140" height="50" class="p-box" style="stroke: #087b87; stroke-width: 2; fill: #f0fdfa;"/>
  <text x="270" y="39" class="p-head" style="fill: #087b87;">Gateway &amp; History</text>
  <text x="270" y="55" class="p-sub">Sliding-Window Store</text>

  <rect x="380" y="18" width="140" height="50" class="p-box"/>
  <text x="450" y="39" class="p-head">Policy Engine</text>
  <text x="450" y="55" class="p-sub">Sequence Classifier</text>

  <rect x="560" y="18" width="140" height="50" class="p-box"/>
  <text x="630" y="39" class="p-head">CRM Simulator</text>
  <text x="630" y="55" class="p-sub">Customer PII Store</text>

  <rect x="740" y="18" width="140" height="50" class="p-box"/>
  <text x="810" y="39" class="p-head">Egress Outbox</text>
  <text x="810" y="55" class="p-sub">External Webhook</text>

  <!-- PHASE 1: BULK CUSTOMER READ -->
  <rect x="30" y="80" width="860" height="24" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="45" y="96" class="phase-label">STEP 1: BULK CUSTOMER READ (BENIGN READ ALLOWED)</text>

  <!-- Step 1: Read Request -->
  <circle cx="105" cy="120" r="8.5" class="step-bg"/><text x="105" y="124" class="step-num">1</text>
  <text x="120" y="124" class="msg-text">tools/call crm.get_customer_records</text>
  <line x1="90" y1="130" x2="262" y2="130" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 2: Read Allow -->
  <circle cx="285" cy="154" r="8.5" class="step-bg"/><text x="285" y="158" class="step-num">2</text>
  <text x="300" y="158" class="msg-text">evaluate(read) → ALLOW · Record in sliding-window history</text>
  <line x1="270" y1="164" x2="442" y2="164" class="msg-line" marker-end="url(#arrow-green)"/>

  <!-- Step 3: Execute Read -->
  <text x="450" y="190" text-anchor="middle" class="msg-text" style="fill: #0369a1;">execute read with bounded permit</text>
  <line x1="270" y1="198" x2="622" y2="198" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 4: 20 records returned -->
  <text x="360" y="222" text-anchor="middle" class="msg-text" style="fill: #0284c7;">20 synthetic customer records returned</text>
  <line x1="630" y1="230" x2="98" y2="230" class="msg-dash" marker-end="url(#arrow)"/>

  <!-- PHASE 2: IMMEDIATE EXTERNAL EGRESS -->
  <rect x="30" y="256" width="860" height="24" rx="4" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
  <text x="45" y="272" class="phase-label" style="fill: #be123c;">STEP 2: IMMEDIATE EXTERNAL EGRESS ATTEMPT (TOXIC SEQUENCE BLOCKED)</text>

  <!-- Step 5: External Send Proposal -->
  <circle cx="105" cy="296" r="8.5" class="step-bg"/><text x="105" y="300" class="step-num">3</text>
  <text x="120" y="300" class="msg-text">tools/call messaging.send_external_webhook(data=records)</text>
  <line x1="90" y1="308" x2="262" y2="308" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 6: Evaluate Against History -->
  <circle cx="285" cy="340" r="8.5" class="step-bg"/><text x="285" y="344" class="step-num">4</text>
  <text x="300" y="344" class="msg-text">evaluate(send, historyContext) · Detects: PII Read → Send</text>
  <line x1="270" y1="352" x2="442" y2="352" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 7: Block Badge & Arrow -->
  <rect x="290" y="374" width="240" height="24" class="badge-red"/>
  <text x="410" y="390" text-anchor="middle" style="fill: #b91c1c; font-size: 11.5px; font-weight: 750;">✕ BLOCK (PII_EXFILTRATION_SEQUENCE)</text>
  <line x1="450" y1="406" x2="278" y2="406" class="msg-dash-red" marker-end="url(#arrow-red)"/>

  <!-- Egress Outbox Never Called -->
  <rect x="720" y="360" width="180" height="74" class="blocked-box"/>
  <text x="810" y="384" text-anchor="middle" style="fill: #dc2626; font-size: 12px; font-weight: 750;">ZERO EGRESS</text>
  <text x="810" y="404" text-anchor="middle" style="fill: #475569; font-size: 11.5px;">Outbox is NEVER called</text>
  <text x="810" y="421" text-anchor="middle" style="fill: #64748b; font-size: 10.5px;">Zero data leaves perimeter</text>

  <!-- Step 8: Error to Caller -->
  <circle cx="105" cy="454" r="8.5" class="step-bg" style="fill: #dc2626;"/><text x="105" y="458" class="step-num">5</text>
  <text x="120" y="458" class="msg-text" style="fill: #dc2626;">Error: Blocked by sequence policy (SYNTHETIC_PII_EXFILTRATION)</text>
  <line x1="270" y1="466" x2="98" y2="466" class="msg-dash-red" marker-end="url(#arrow-red)"/>
</svg>
