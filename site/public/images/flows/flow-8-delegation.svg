<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="728" viewBox="0 0 1000 728" role="img" aria-labelledby="flow-8-delegation-title flow-8-delegation-desc">
<title id="flow-8-delegation-title">Flow 8: signed child authority must narrow its parent</title>
<desc id="flow-8-delegation-desc">Supply action-bound workload credential and signed parent grant. Supply child grant linked to the exact signed parent hash. Verify trusted issuers/keys, signatures, action context, audience, expiry and chain links. Require child scopes/resources to be subsets and lifetime not to exceed parent. Valid narrowed chain: construct canonical action, then evaluate organizational policy. Only a separate allow plus verified permit enables one simulated read. Separate negative cases: widen scope, resource, audience or lifetime. Reject before canonical policy evaluation.. These are identity-boundary failures, not policy-block results. Causal lineage alone grants no authority.</desc>
