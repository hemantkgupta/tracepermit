<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="776" viewBox="0 0 1000 776" role="img" aria-labelledby="flow-11-package-startup-title flow-11-package-startup-desc">
<title id="flow-11-package-startup-title">Flow 11: offline check, explicit initialization, strict startup</title>
<desc id="flow-11-package-startup-desc">Run --check with private configuration, key files and bundled assets. Report offline validity only, no database, IdP traffic or listener. For first installation only, explicitly run --init-db. Hold the initialization lock and install only into a fresh empty dedicated schema. Run --run using the same operator-owned configuration. Validate existing schema and recovery state, never implicitly migrate or repair. Bind 127.0.0.1 and compose authenticated API, optional inbox and approval MCP. Normal runtime needs operator OIDC and PostgreSQL. The synthetic source demo is a different test composition.. An archive manifest identifies a clean source build, not signed provenance or production readiness.</desc>
