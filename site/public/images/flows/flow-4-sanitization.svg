<title id="flow-4-sanitization-title">Flow 4: derive, re-evaluate, then authorize</title>
<desc id="flow-4-sanitization-desc">Propose a simulated log read with limit 500 (valid schema, oversized window). Evaluate original action, observe OVERSIZED_RESULT_WINDOW. SANITIZE: LOG_RESULT_WINDOW_REQUIRES_SANITIZATION. Run only bounded-log-read/v1, clamp limit to 100. Return new event identity and original/effective hash linkage. Re-evaluate the effective action, sanitization is not permission. ALLOW the bounded derived request under current policy. Issue and verify effective-action permit, claim once, then read. Return up to 100 matching simulated events plus sanitization summary. Unknown transformer, invalid output or failed re-evaluation: no dispatch. Limit 50000 fails schema validation.</desc>
