<svg xmlns="http://www.w3.org/2000/svg" width="890" height="490" viewBox="0 0 890 490" role="img" aria-labelledby="f4-title f4-desc">
  <title id="f4-title">Flow 4: Action Sanitization (Self-Healing Guardrails)</title>
  <desc id="f4-desc">Sequence diagram illustrating argument transformation, derived canonical action minting, and re-evaluation before execution.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .p-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8px; }
      .p-head { fill: #0f172a; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .p-sub { fill: #64748b; font-size: 11px; text-anchor: middle; }
      .line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .msg-line { stroke: #475569; stroke-width: 1.5; fill: none; }
      .msg-dash { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .msg-text { fill: #1e293b; font-size: 12px; font-weight: 550; }
      .step-bg { fill: #087b87; }
      .step-num { fill: #ffffff; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
      .badge-blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 1; rx: 4px; }
      .badge-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; rx: 4px; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="890" height="490" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Lifelines -->
  <line x1="90" y1="65" x2="90" y2="460" class="line"/>
  <line x1="270" y1="65" x2="270" y2="460" class="line"/>
  <line x1="450" y1="65" x2="450" y2="460" class="line"/>
  <line x1="630" y1="65" x2="630" y2="460" class="line"/>
  <line x1="800" y1="65" x2="800" y2="460" class="line"/>

  <!-- Participants -->
  <rect x="20" y="16" width="140" height="48" class="p-box"/>
  <text x="90" y="37" class="p-head">Agent / Workload</text>
  <text x="90" y="52" class="p-sub">Proposes Oversized Call</text>

  <rect x="200" y="16" width="140" height="48" class="p-box" style="stroke: #087b87; stroke-width: 2;"/>
  <text x="270" y="37" class="p-head" style="fill: #087b87;">Trusted Gateway</text>
  <text x="270" y="52" class="p-sub">Mediator &amp; Coordinator</text>

  <rect x="380" y="16" width="140" height="48" class="p-box"/>
  <text x="450" y="37" class="p-head">Policy Engine</text>
  <text x="450" y="52" class="p-sub">Classifier &amp; Rules</text>

  <rect x="560" y="16" width="140" height="48" class="p-box"/>
  <text x="630" y="37" class="p-head">Allowlisted Sanitizer</text>
  <text x="630" y="52" class="p-sub">Deterministic Clamper</text>

  <rect x="730" y="16" width="140" height="48" class="p-box"/>
  <text x="800" y="37" class="p-head">Target Simulator</text>
  <text x="800" y="52" class="p-sub">Safe AWS Logs Target</text>

  <!-- Step 1: Oversized call -->
  <circle cx="100" cy="98" r="8.5" class="step-bg"/><text x="100" y="102" class="step-num">1</text>
  <text x="114" y="102" class="msg-text">tools/call filter_log_events (limit: 50000)</text>
  <line x1="90" y1="108" x2="264" y2="108" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 2: Evaluate Original -->
  <circle cx="280" cy="138" r="8.5" class="step-bg"/><text x="280" y="142" class="step-num">2</text>
  <text x="294" y="142" class="msg-text">evaluate(original action)</text>
  <line x1="270" y1="148" x2="444" y2="148" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 3: SANITIZE Outcome -->
  <rect x="300" y="166" width="150" height="20" class="badge-blue"/>
  <text x="375" y="180" text-anchor="middle" style="fill: #1d4ed8; font-size: 11px; font-weight: 700;">⚙ SANITIZE (OVERSIZED)</text>
  <line x1="450" y1="192" x2="276" y2="192" class="msg-dash" marker-end="url(#arrow-blue)"/>

  <!-- Step 4: Transform -->
  <circle cx="280" cy="222" r="8.5" class="step-bg"/><text x="280" y="226" class="step-num">3</text>
  <text x="294" y="226" class="msg-text">transform(original action) · Clamp limit: 100</text>
  <line x1="270" y1="232" x2="624" y2="232" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 5: Derived Action -->
  <text x="450" y="262" text-anchor="middle" class="msg-text" style="fill: #2563eb;">Derived Action (limit: 100, new actionHash, parentEventId)</text>
  <line x1="630" y1="268" x2="276" y2="268" class="msg-dash" marker-end="url(#arrow-blue)"/>

  <!-- Step 6: Re-evaluate Derived -->
  <circle cx="280" cy="298" r="8.5" class="step-bg"/><text x="280" y="302" class="step-num">4</text>
  <text x="294" y="302" class="msg-text">evaluate(derived canonical action)</text>
  <line x1="270" y1="308" x2="444" y2="308" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 7: ALLOW Outcome -->
  <rect x="300" y="326" width="140" height="20" class="badge-green"/>
  <text x="370" y="340" text-anchor="middle" style="fill: #15803d; font-size: 11px; font-weight: 700;">✓ ALLOW (BOUNDED)</text>
  <line x1="450" y1="352" x2="276" y2="352" class="msg-dash" marker-end="url(#arrow-green)"/>

  <!-- Step 8: Execute Derived -->
  <circle cx="280" cy="382" r="8.5" class="step-bg"/><text x="280" y="386" class="step-num">5</text>
  <text x="294" y="386" class="msg-text">execute(derived action, permit bound to new hash)</text>
  <line x1="270" y1="392" x2="794" y2="392" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 9: 100 logs -->
  <text x="535" y="422" text-anchor="middle" class="msg-text" style="fill: #64748b;">100 simulated log lines returned</text>
  <line x1="800" y1="428" x2="276" y2="428" class="msg-dash" marker-end="url(#arrow)"/>

  <!-- Step 10: Client Result -->
  <circle cx="100" cy="448" r="8.5" class="step-bg"/><text x="100" y="452" class="step-num">6</text>
  <text x="114" y="452" class="msg-text">Tool result: 100 events + sanitization notice</text>
  <line x1="270" y1="458" x2="96" y2="458" class="msg-dash" marker-end="url(#arrow)"/>
</svg>
