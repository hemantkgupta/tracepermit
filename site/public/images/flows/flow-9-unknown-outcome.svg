<title id="flow-9-unknown-outcome-title">Flow 9: lost completion is not permission to repeat</title>
<desc id="flow-9-unknown-outcome-desc">Commit approval consumption and executing claim before dispatch. Invoke the approved simulator action. Attempt separate completion write, a fault can leave consumed/executing. Return safe error, not invented failure or success, inspect durable status. After restart, attempt resume of the same approval. Reject redispatch because the authority is already consumed. Separate tested recovery foundation: only persisted UNKNOWN attempts enter the leased lookup worker.. Lease unknown candidates bound to tenant, adapter and idempotency identity. Perform reviewed read-only outcome lookup, never invoke the original effect. Append terminal outcome only when confirmed, otherwise defer and remain unknown. No automatic executing-to-unknown sweep or worker is wired into the browser approval launcher, real-target lookup remains future work.</desc>
