<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" role="img" aria-labelledby="f1-title f1-desc">
  <title id="f1-title">Flow 1: Safe Read (Autonomous Allow)</title>
  <desc id="f1-desc">Sequence diagram illustrating an autonomous allowed read request flowing through TracePermit gateway to a safe simulator.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .p-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8px; }
      .p-head { fill: #0f172a; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .p-sub { fill: #64748b; font-size: 11px; text-anchor: middle; }
      .line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .msg-line { stroke: #475569; stroke-width: 1.5; fill: none; }
      .msg-dash { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .msg-text { fill: #1e293b; font-size: 12.5px; font-weight: 550; }
      .step-bg { fill: #087b87; }
      .step-num { fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .badge-allow { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; rx: 4px; }
      .badge-text { fill: #15803d; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="880" height="450" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Lifelines -->
  <line x1="110" y1="65" x2="110" y2="420" class="line"/>
  <line x1="330" y1="65" x2="330" y2="420" class="line"/>
  <line x1="550" y1="65" x2="550" y2="420" class="line"/>
  <line x1="770" y1="65" x2="770" y2="420" class="line"/>

  <!-- Participants -->
  <rect x="35" y="16" width="150" height="48" class="p-box"/>
  <text x="110" y="37" class="p-head">Agent / Client</text>
  <text x="110" y="52" class="p-sub">ChatGPT / Claude / CLI</text>

  <rect x="255" y="16" width="150" height="48" class="p-box" style="stroke: #087b87; stroke-width: 2;"/>
  <text x="330" y="37" class="p-head" style="fill: #087b87;">Trusted Gateway</text>
  <text x="330" y="52" class="p-sub">Java MCP / API Adapter</text>

  <rect x="475" y="16" width="150" height="48" class="p-box"/>
  <text x="550" y="37" class="p-head">Policy Engine</text>
  <text x="550" y="52" class="p-sub">Classifier &amp; Permits</text>

  <rect x="695" y="16" width="150" height="48" class="p-box"/>
  <text x="770" y="37" class="p-head">Target Simulator</text>
  <text x="770" y="52" class="p-sub">AWS CloudWatch Mocks</text>

  <!-- Step 1: tools/call -->
  <circle cx="120" cy="100" r="9" class="step-bg"/><text x="120" y="104" class="step-num">1</text>
  <text x="136" y="104" class="msg-text">tools/call aws.logs.filter_log_events (Bearer token)</text>
  <line x1="110" y1="110" x2="324" y2="110" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 2: Normalize -->
  <circle cx="340" cy="142" r="9" class="step-bg"/><text x="340" y="146" class="step-num">2</text>
  <text x="356" y="146" class="msg-text">Verify token &amp; build Canonical Action (SHA-256)</text>
  <path d="M 330 148 H 360 V 162 H 336" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 3: Evaluate -->
  <circle cx="340" cy="192" r="9" class="step-bg"/><text x="340" y="196" class="step-num">3</text>
  <text x="356" y="196" class="msg-text">evaluate(canonical action, policyVersion)</text>
  <line x1="330" y1="202" x2="544" y2="202" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 4: Decision: ALLOW -->
  <rect x="360" y="224" width="160" height="22" class="badge-allow"/>
  <text x="440" y="239" text-anchor="middle" class="badge-text">✓ ALLOW (BOUNDED_READ)</text>
  <line x1="550" y1="248" x2="336" y2="248" class="msg-dash" marker-end="url(#arrow-green)"/>

  <!-- Step 5: Issue Permit -->
  <circle cx="340" cy="278" r="9" class="step-bg"/><text x="340" y="282" class="step-num">4</text>
  <text x="356" y="282" class="msg-text">Issue single-use Execution Permit (JWS)</text>
  <line x1="550" y1="288" x2="336" y2="288" class="msg-dash" marker-end="url(#arrow)"/>

  <!-- Step 6: Execute against simulator -->
  <circle cx="340" cy="320" r="9" class="step-bg"/><text x="340" y="324" class="step-num">5</text>
  <text x="356" y="324" class="msg-text">execute(canonical action, permit) · Atomically claims 1x</text>
  <line x1="330" y1="330" x2="764" y2="330" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 7: Simulated log response -->
  <text x="550" y="362" text-anchor="middle" class="msg-text" style="fill: #64748b;">Simulated CloudWatch log events</text>
  <line x1="770" y1="368" x2="336" y2="368" class="msg-dash" marker-end="url(#arrow)"/>

  <!-- Step 8: Return MCP tool result -->
  <circle cx="120" cy="398" r="9" class="step-bg"/><text x="120" y="402" class="step-num">6</text>
  <text x="136" y="402" class="msg-text">MCP tool result (Bounded log lines)</text>
  <line x1="330" y1="408" x2="116" y2="408" class="msg-dash" marker-end="url(#arrow)"/>
</svg>
