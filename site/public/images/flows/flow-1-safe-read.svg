<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-labelledby="f1-title f1-desc">
  <title id="f1-title">Flow 1: Safe Read (Autonomous Allow)</title>
  <desc id="f1-desc">Sequence diagram illustrating an autonomous allowed read request flowing through TracePermit gateway to a safe simulator.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .p-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8px; }
      .p-head { fill: #0f172a; font-size: 14.5px; font-weight: 750; text-anchor: middle; }
      .p-sub { fill: #64748b; font-size: 11.5px; text-anchor: middle; }
      .line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .msg-line { stroke: #475569; stroke-width: 1.8; fill: none; }
      .msg-dash { stroke: #475569; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
      .msg-dash-green { stroke: #16a34a; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
      .msg-text { fill: #0f172a; font-size: 13px; font-weight: 600; }
      .step-bg { fill: #087b87; }
      .step-num { fill: #ffffff; font-size: 11px; font-weight: 750; text-anchor: middle; }
      .badge-allow { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.2; rx: 5px; }
      .badge-text { fill: #15803d; font-size: 12px; font-weight: 750; text-anchor: middle; }
      .proc-box { fill: #f0fdfa; stroke: #087b87; stroke-width: 1.2; rx: 6px; }
      .proc-text { fill: #0f766e; font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="470" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Lifelines -->
  <line x1="110" y1="68" x2="110" y2="445" class="line"/>
  <line x1="340" y1="68" x2="340" y2="445" class="line"/>
  <line x1="570" y1="68" x2="570" y2="445" class="line"/>
  <line x1="800" y1="68" x2="800" y2="445" class="line"/>

  <!-- Participants -->
  <rect x="35" y="18" width="150" height="50" class="p-box"/>
  <text x="110" y="39" class="p-head">Agent / Client</text>
  <text x="110" y="55" class="p-sub">ChatGPT / Claude / CLI</text>

  <rect x="255" y="18" width="170" height="50" class="p-box" style="stroke: #087b87; stroke-width: 2; fill: #f0fdfa;"/>
  <text x="340" y="39" class="p-head" style="fill: #087b87;">Trusted Gateway</text>
  <text x="340" y="55" class="p-sub">Java MCP / API Adapter</text>

  <rect x="485" y="18" width="170" height="50" class="p-box"/>
  <text x="570" y="39" class="p-head">Policy Engine</text>
  <text x="570" y="55" class="p-sub">Classifier &amp; Permits</text>

  <rect x="715" y="18" width="170" height="50" class="p-box"/>
  <text x="800" y="39" class="p-head">Target Simulator</text>
  <text x="800" y="55" class="p-sub">AWS CloudWatch Mocks</text>

  <!-- Step 1: tools/call -->
  <circle cx="125" cy="100" r="9" class="step-bg"/><text x="125" y="104" class="step-num">1</text>
  <text x="142" y="104" class="msg-text">tools/call aws.logs.filter_log_events (Bearer token)</text>
  <line x1="110" y1="112" x2="332" y2="112" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 2: Normalize & Compute Action -->
  <rect x="205" y="136" width="270" height="30" class="proc-box"/>
  <circle cx="222" cy="151" r="8" class="step-bg"/><text x="222" y="155" class="step-num">2</text>
  <text x="238" y="155" class="proc-text">Verify token &amp; compute Canonical Action</text>

  <!-- Step 3: Evaluate -->
  <circle cx="355" cy="192" r="9" class="step-bg"/><text x="355" y="196" class="step-num">3</text>
  <text x="372" y="196" class="msg-text">evaluate(canonical action, policyVersion)</text>
  <line x1="340" y1="204" x2="562" y2="204" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 4: Decision ALLOW + Issue Permit -->
  <rect x="375" y="226" width="160" height="24" class="badge-allow"/>
  <text x="455" y="242" class="badge-text">✓ ALLOW (BOUNDED_READ)</text>
  <line x1="570" y1="258" x2="348" y2="258" class="msg-dash-green" marker-end="url(#arrow-green)"/>

  <circle cx="355" cy="286" r="9" class="step-bg"/><text x="355" y="290" class="step-num">4</text>
  <text x="372" y="290" class="msg-text" style="fill: #15803d;">Issue single-use Execution Permit (JWS)</text>
  <line x1="570" y1="298" x2="348" y2="298" class="msg-dash-green" marker-end="url(#arrow-green)"/>

  <!-- Step 5: Execute Against Simulator -->
  <circle cx="355" cy="336" r="9" class="step-bg"/><text x="355" y="340" class="step-num">5</text>
  <text x="372" y="340" class="msg-text">execute(canonical action, permit) · Atomically claims 1x</text>
  <line x1="340" y1="348" x2="792" y2="348" class="msg-line" marker-end="url(#arrow)"/>

  <!-- Step 6: Simulated Log Results -->
  <text x="570" y="380" text-anchor="middle" class="msg-text" style="fill: #475569;">Simulated CloudWatch log events returned</text>
  <line x1="800" y1="388" x2="348" y2="388" class="msg-dash" marker-end="url(#arrow)"/>

  <!-- Step 7: Return MCP Tool Result -->
  <circle cx="125" cy="418" r="9" class="step-bg"/><text x="125" y="422" class="step-num">6</text>
  <text x="142" y="422" class="msg-text">MCP tool result (Bounded log lines)</text>
  <line x1="340" y1="428" x2="118" y2="428" class="msg-dash" marker-end="url(#arrow)"/>
</svg>
