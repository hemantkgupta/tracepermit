<title id="flow-1-safe-read-title">Flow 1: bounded read allowed by policy</title>
<desc id="flow-1-safe-read-desc">Propose aws.logs.filter_log_events with a bounded limit. Authenticate and verify the source proof when the CLI profile requires it. Construct the canonical action and evaluate the active policy. ALLOW: issue and verify an exact short-lived permit, claim single use. Invoke the simulator with the verified action, not a credential-bearing cloud API. Return up to the requested number of matching simulated log events. Persist bounded decision and outcome evidence in the selected profile. Return the MCP result, the console is outside the execution path</desc>
