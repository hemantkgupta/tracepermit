<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="932" viewBox="0 0 1000 932" role="img" aria-labelledby="flow-12-recovery-quarantine-title flow-12-recovery-quarantine-desc">
<title id="flow-12-recovery-quarantine-title">Flow 12: inspect stored state and explicitly quarantine new authority</title>
<desc id="flow-12-recovery-quarantine-desc">First stop agents and effectful services independently. Quarantine cannot cancel already committed claims.. Run --recovery-inspect with separate owner configuration. Read aggregate stored-state counts in one read-only snapshot. Return bounded counts, not target outcome proof or permission to resume. Explicitly run --quarantine-db against the intended simulator database. Serialize and commit the one-way recovery guard transition. Attempt a new authority claim or approval review after quarantine. Refuse new authority writes, previous claim completion remains possible. Attempt --run against an already quarantined database. Refuse startup, no resume or quarantine-clear command is provided. An older restored ready row is not detected automatically. This is declared containment, not a restore fence.</desc>
