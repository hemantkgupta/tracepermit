<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
  <title id="title">TracePermit endpoint connector: observe locally, enforce at the backend</title>
  <desc id="desc">All components in this evaluation run on one Mac. Codex launches a Java 21 connector over stdio. The connector observes its caller and signs method and parameters plus a credential fingerprint. Direct numeric-loopback HTTP carries the bearer and proof to the Java gateway. The gateway verifies identity and proof, evaluates policy, and issues a request-bound permit only for allowed simulator execution. A block has no dispatch. The React console displays bounded evidence. No remote backend is supported by this profile.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52647d"/></marker>
  </defs>
  <rect width="1120" height="510" rx="16" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="37" font-size="23" font-weight="700" fill="#142338">One Mac. Two responsibilities.</text>
    <text x="32" y="64" font-size="15" fill="#52647d">The endpoint supplies measured provenance. The backend decides whether a simulated action may execute.</text>
    <rect x="24" y="88" width="1072" height="351" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="44" y="116" font-size="13" font-weight="700" letter-spacing="1" fill="#52647d">CURRENT LOCAL EVALUATION · NO REAL AWS CALLS</text>
    <rect x="44" y="153" width="170" height="210" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="70" cy="179" r="13" fill="#e8eef8"/><text x="70" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#234a85">1</text>
    <text x="60" y="213" font-size="19" font-weight="700" fill="#142338">Codex CLI</text>
    <text x="60" y="245" font-size="15" fill="#34465e">Proposes a tool call</text>
    <text x="60" y="270" font-size="15" fill="#34465e">Starts connector</text>
    <text x="60" y="295" font-size="15" fill="#34465e">Receives decision</text>
    <text x="60" y="340" font-size="13" fill="#52647d">Own account sign-in</text>
    <path d="M214 256H270" stroke="#52647d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="242" y="242" text-anchor="middle" font-size="13" fill="#52647d">stdio</text>
    <rect x="278" y="153" width="248" height="210" rx="12" fill="#edf5ff" stroke="#93b9eb"/>
    <circle cx="304" cy="179" r="13" fill="#234a85"/><text x="304" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="294" y="213" font-size="19" font-weight="700" fill="#142338">Java endpoint connector</text>
    <text x="294" y="245" font-size="15" fill="#34465e">Observe caller + terminal</text>
    <text x="294" y="270" font-size="15" fill="#34465e">Sign exact request binding</text>
    <text x="294" y="295" font-size="15" fill="#34465e">Recheck caller stability</text>
    <text x="294" y="340" font-size="13" fill="#234a85">Local development signing key</text>
    <path d="M526 256H602" stroke="#52647d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="564" y="217" text-anchor="middle" font-size="13" fill="#52647d">Bearer</text>
    <text x="564" y="237" text-anchor="middle" font-size="13" fill="#52647d">+ proof</text>
    <text x="564" y="281" text-anchor="middle" font-size="13" fill="#52647d">HTTP</text>
    <rect x="610" y="153" width="238" height="210" rx="12" fill="#edf5ff" stroke="#93b9eb"/>
    <circle cx="636" cy="179" r="13" fill="#234a85"/><text x="636" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="626" y="213" font-size="19" font-weight="700" fill="#142338">Java TP backend</text>
    <text x="626" y="245" font-size="15" fill="#34465e">Verify credential + proof</text>
    <text x="626" y="270" font-size="15" fill="#34465e">Normalize + evaluate policy</text>
    <text x="626" y="295" font-size="15" fill="#34465e">Verify permit at execution</text>
    <text x="626" y="340" font-size="13" fill="#234a85">127.0.0.1:8080/mcp</text>
    <path d="M848 231H899" stroke="#52647d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="875" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#146443">Allow</text>
    <rect x="907" y="153" width="169" height="113" rx="12" fill="#ecf8f0" stroke="#91c7a3"/>
    <circle cx="933" cy="179" r="13" fill="#146443"/><text x="933" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    <text x="923" y="213" font-size="18" font-weight="700" fill="#142338">Safe simulator</text>
    <text x="923" y="243" font-size="14" fill="#34465e">No target credentials</text>
    <path d="M848 314H899" stroke="#52647d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="875" y="299" text-anchor="middle" font-size="13" font-weight="700" fill="#9c2838">Block</text>
    <rect x="907" y="287" width="169" height="76" rx="12" fill="#fff0f2" stroke="#e4a8b1"/>
    <text x="923" y="318" font-size="18" font-weight="700" fill="#9c2838">No dispatch</text>
    <text x="923" y="343" font-size="14" fill="#34465e">No simulated effect</text>
    <text x="44" y="406" font-size="15" fill="#34465e">Bounded evidence → React console at 127.0.0.1:5173 · results return through the connector to Codex</text>
    <text x="32" y="472" font-size="15" font-weight="700" fill="#142338">Local proof is not managed-device trust.</text>
    <text x="32" y="496" font-size="14" fill="#52647d">File keys, synthetic identity, process-local replay · no remote transport, protected enrollment or system-wide bypass prevention</text>
  </g>
</svg>
