<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300" role="img" aria-labelledby="title desc">
  <title id="title">TracePermit runtime architecture</title>
  <desc id="desc">Three origin paths converge on a Java Agentic Visibility and Control gateway. Trusted adapters verify identity, normalize the proposed action, classify intent and sequence risk, and evaluate policy before a request-bound permit can reach a simulator. Blocked or pending actions have no dispatch. Bounded evidence is shown afterward in a read-only console.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#64849b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .ink { fill: #17354b; }
      .muted { fill: #547085; }
      .label { fill: #087b87; font-size: 18px; font-weight: 750; letter-spacing: 1.4px; }
      .title { fill: #102f47; font-size: 38px; font-weight: 800; }
      .subtitle { fill: #506c80; font-size: 19px; }
      .card-title { fill: #17354b; font-size: 23px; font-weight: 750; }
      .body { fill: #355369; font-size: 18px; }
      .step-title { fill: #17354b; font-size: 22px; font-weight: 750; }
      .step-body { fill: #49687a; font-size: 18px; }
    </style>
  </defs>

  <rect width="1000" height="1300" fill="#ffffff"/>
  <rect x="44" y="42" width="8" height="78" rx="4" fill="#087b87"/>
  <text class="title" x="68" y="78">TracePermit</text>
  <text class="subtitle" x="68" y="111">Agentic Visibility &amp; Control (AVC) · runtime architecture</text>

  <text class="label" x="44" y="165">ORIGINS · DIFFERENT PROOFS, ONE ACTION CONTRACT</text>

  <rect x="44" y="187" width="288" height="219" rx="17" fill="#f1f8fb" stroke="#9ac7d1" stroke-width="2"/>
  <rect x="44" y="187" width="288" height="8" rx="4" fill="#087b87"/>
  <text class="card-title" x="65" y="229">Local CLI / agent</text>
  <text class="body" x="65" y="267">Human goal → tool proposal</text>
  <text class="body" x="65" y="300">Endpoint connector observes</text>
  <text class="body" x="65" y="328">process + device context</text>
  <text class="body" x="65" y="363">Signs exact MCP request</text>
  <text class="muted" x="65" y="390" font-size="16">Provenance ≠ permission</text>

  <rect x="356" y="187" width="288" height="219" rx="17" fill="#f1f8fb" stroke="#9ac7d1" stroke-width="2"/>
  <rect x="356" y="187" width="288" height="8" rx="4" fill="#087b87"/>
  <text class="card-title" x="377" y="229">Hosted AI client</text>
  <text class="body" x="377" y="267">Prompt → provider model</text>
  <text class="body" x="377" y="300">Model proposes MCP call</text>
  <text class="body" x="377" y="334">IdP OAuth attributes user</text>
  <text class="body" x="377" y="367">Outbound tunnel reaches</text>
  <text class="body" x="377" y="393">private Java endpoint</text>

  <rect x="668" y="187" width="288" height="219" rx="17" fill="#f1f8fb" stroke="#9ac7d1" stroke-width="2"/>
  <rect x="668" y="187" width="288" height="8" rx="4" fill="#087b87"/>
  <text class="card-title" x="689" y="229">Automation / API</text>
  <text class="body" x="689" y="267">Scheduler or direct client</text>
  <text class="body" x="689" y="300">Signed workload proof</text>
  <text class="body" x="689" y="334">Narrow delegation chain</text>
  <text class="body" x="689" y="367">Adapter verifies trigger,</text>
  <text class="body" x="689" y="393">scope, audience + expiry</text>

  <path d="M188 407 V439 H500 M500 407 V439 M812 407 V439 H500 V455" fill="none" stroke="#64849b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="44" y="470" width="912" height="581" rx="21" fill="#f8fbfd" stroke="#8baec1" stroke-width="2.5"/>
  <rect x="44" y="470" width="912" height="57" rx="20" fill="#173c57"/>
  <rect x="44" y="505" width="912" height="22" fill="#173c57"/>
  <text x="70" y="508" fill="#ffffff" font-size="25" font-weight="750" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">JAVA ENFORCEMENT DATA PLANE</text>
  <text x="918" y="507" text-anchor="end" fill="#cde7ed" font-size="17" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">TRUST BOUNDARY</text>

  <rect x="70" y="550" width="860" height="88" rx="12" fill="#ffffff" stroke="#b6cbd7" stroke-width="1.5"/>
  <circle cx="101" cy="594" r="17" fill="#087b87"/><text x="101" y="600" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="750">1</text>
  <text class="step-title" x="131" y="583">Trusted protocol adapters + identity verifier</text>
  <text class="step-body" x="131" y="613">Verify token, source signature or workload proof; reject body-supplied identity.</text>
  <path d="M500 639 V657" fill="none" stroke="#64849b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="70" y="665" width="860" height="88" rx="12" fill="#ffffff" stroke="#b6cbd7" stroke-width="1.5"/>
  <circle cx="101" cy="709" r="17" fill="#087b87"/><text x="101" y="715" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="750">2</text>
  <text class="step-title" x="131" y="698">Canonical action + server-owned sequence</text>
  <text class="step-body" x="131" y="728">Separate subject, actor, trigger, target, arguments and delegated authority.</text>
  <path d="M500 754 V772" fill="none" stroke="#64849b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="70" y="780" width="860" height="88" rx="12" fill="#ffffff" stroke="#b6cbd7" stroke-width="1.5"/>
  <circle cx="101" cy="824" r="17" fill="#087b87"/><text x="101" y="830" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="750">3</text>
  <text class="step-title" x="131" y="813">Semantic intent + risk classifier</text>
  <text class="step-body" x="131" y="843">Tool schema, proposed effect, resource sensitivity and recent actions.</text>
  <path d="M500 869 V887" fill="none" stroke="#64849b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="70" y="895" width="860" height="110" rx="12" fill="#eaf4f7" stroke="#86b7c2" stroke-width="1.5"/>
  <circle cx="101" cy="944" r="17" fill="#087b87"/><text x="101" y="950" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="750">4</text>
  <text class="step-title" x="131" y="932">Versioned policy decision</text>
  <text class="step-body" x="131" y="961">Allow · block · sanitize and recheck · exact human approval</text>
  <text x="131" y="990" fill="#087b87" font-size="17" font-weight="650">Default: no permit when proof, policy or required state is uncertain.</text>

  <path d="M500 1052 V1070 H268 V1081" fill="none" stroke="#64849b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M500 1070 H732 V1081" fill="none" stroke="#64849b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="44" y="1092" width="437" height="102" rx="15" fill="#eff9f3" stroke="#74b994" stroke-width="2"/>
  <text x="68" y="1130" fill="#166647" font-size="21" font-weight="750">ALLOW / EXACT APPROVAL</text>
  <text x="68" y="1161" fill="#355369" font-size="18">One-use permit → executor →</text>
  <text x="68" y="1185" fill="#355369" font-size="18">AWS/Jira-like simulator only</text>

  <rect x="519" y="1092" width="437" height="102" rx="15" fill="#fff4f3" stroke="#cf827e" stroke-width="2"/>
  <text x="543" y="1130" fill="#a53332" font-size="21" font-weight="750">BLOCK / PENDING</text>
  <text x="543" y="1161" fill="#355369" font-size="18">No permit; no target dispatch.</text>
  <text x="543" y="1185" fill="#355369" font-size="18">Sanitized calls re-enter policy.</text>

  <path d="M268 1195 V1211 H500 M732 1195 V1211 H500 V1218" fill="none" stroke="#64849b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="44" y="1230" width="912" height="48" rx="12" fill="#eef2f5" stroke="#becdd6" stroke-width="1.5"/>
  <text x="68" y="1260" fill="#355369" font-size="18" font-weight="650">After decision: bounded evidence → read-only React console; tool result → caller</text>
</svg>
